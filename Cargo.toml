[package]
name = "cloister"
version = "0.1.1"
edition = "2024"
authors = ["Leo Sagan <x.com/EthSagan>"]
description = "A cloistered text editor, with no strings attached. Offline first, no tracking, no ads, no spyware, no data collection, just you and your files."
license = "MIT"
repository = "https://github.com/sagan-emanuar/cloister"
readme = "README.md"

[dependencies]
anyhow = "1.0.98"
directories = "6.0.0"
eframe = "0.31.1"
egui = "0.31.1"
rfd = "0.14.1"
serde = "1.0.219"
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
